<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="830" viewBox="0 0 1450 830" role="img" aria-labelledby="title desc">
<title id="title">The Last Platform: proposed route relationships</title>
<desc id="desc">A forward main route crosses the station, viaduct, freight district, quiet Registry, archive and departure. An optional roof loop and a lower recovery route reconnect before required evidence. This is a topology proposal, not a playable map.</desc>
